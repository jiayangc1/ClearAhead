name: Application checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings=0
      - run: npm test
      - run: npm --prefix modules/react-native-clear-ahead-vision ci
      - run: npm --prefix modules/react-native-clear-ahead-vision run typecheck
      - run: npm --prefix modules/react-native-clear-ahead-vision run codegen
      - name: Check Nitro generation drift
        run: git diff --exit-code -- modules/react-native-clear-ahead-vision/nitrogen/generated

  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: npm ci
      - run: bundle exec pod install --project-directory=ios
      - name: Build app and run native regressions
        run: python3 scripts/check-ios.py
