name: Package YOLO26 Core ML models

on:
  workflow_dispatch:
  push:
    branches:
      - codex/package-yolo26-models
    paths:
      - .github/workflows/package-yolo26-models.yml
      - scripts/export-yolo26-models.py
      - scripts/model-requirements.txt

permissions:
  contents: write

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/model-requirements.txt
      - name: Install pinned exporter
        run: python -m pip install -r scripts/model-requirements.txt
      - name: Export and validate official nano models
        run: python scripts/export-yolo26-models.py --output modules/react-native-clear-ahead-vision/models
      - name: Commit packaged models
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f modules/react-native-clear-ahead-vision/models/YOLO26n.mlpackage
          git add -f modules/react-native-clear-ahead-vision/models/YOLO26nDepth.mlpackage
          git add -f modules/react-native-clear-ahead-vision/models/model-manifest.json
          git diff --cached --quiet || git commit -m "build(ios): package YOLO26 nano models"
          git push
