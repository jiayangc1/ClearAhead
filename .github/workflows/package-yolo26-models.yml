name: Package YOLO26 Core ML models

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/lekang
    paths:
      - .github/workflows/package-yolo26-models.yml
      - scripts/export-yolo26-models.py
      - scripts/model-requirements.txt

permissions:
  contents: write

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/model-requirements.txt
      - name: Install pinned exporter
        run: python -m pip install -r scripts/model-requirements.txt
      - name: Export and validate all downloadable model pairs
        run: python scripts/export-yolo26-models.py --output modules/react-native-clear-ahead-vision/models --variants all --release-output release-assets
      - name: Publish verified runtime model assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view yolo26-coreml-v1 >/dev/null 2>&1 || gh release create yolo26-coreml-v1 --title "YOLO26 Core ML models" --notes "INT8 Core ML detector and depth pairs downloaded automatically by Clear Ahead."
          gh release upload yolo26-coreml-v1 release-assets/* --clobber
